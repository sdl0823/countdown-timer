<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Countdown Timer Clock</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="timer-container" id="timerContainer">
    <div class="decorative-elements star1">⭐</div>
    <div class="decorative-elements star2">✨</div>
    <div class="decorative-elements star3">🌟</div>
    <div class="decorative-elements star4">💫</div>
    
    <h1 class="title" id="timerTitle">可愛倒數計時器</h1>
    
    <div class="clock-display" id="clockDisplay">
      <div class="time-unit">
        <div class="time-number" id="hours">00</div>
        <div class="time-label">小時</div>
      </div>
      <div class="time-unit">
        <div class="time-number" id="minutes">00</div>
        <div class="time-label">分鐘</div>
      </div>
      <div class="time-unit">
        <div class="time-number" id="seconds">00</div>
        <div class="time-label">秒</div>
      </div>
    </div>
    
    <div class="time-inputs">
      <div class="time-input-group">
        <label for="hoursInput">小時</label>
        <input type="number" id="hoursInput" min="0" max="99" value="0" placeholder="0">
      </div>
      <div class="time-input-group">
        <label for="minutesInput">分鐘</label>
        <input type="number" id="minutesInput" min="0" max="59" value="1" placeholder="0">
      </div>
      <div class="time-input-group">
        <label for="secondsInput">秒</label>
        <input type="number" id="secondsInput" min="0" max="59" value="0" placeholder="0">
      </div>
    </div>
    
    <div class="controls">
      <button class="control-button start-button" id="startButton">▶️ 開始</button>
      <button class="control-button pause-button" id="pauseButton">⏸️ 暫停</button>
      <button class="control-button reset-button" id="resetButton">🔄 重置</button>
    </div>
    
    <div class="image-upload">
      <button class="upload-button" id="uploadButton">🖼️ 更換背景圖片</button>
      <input type="file" id="imageInput" accept="image/*">
    </div>
  </div>
  
  <script src="script.js"></script>
</body>
</html>
